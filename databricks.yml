# This is a Databricks asset bundle definition for marvelous-databricks-course-tanialemos.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: marvelous-databricks-course-tanialemos
  cluster_id: 1018-083141-23tyfdqk

artifacts:
  default:
    type: whl
    build: python -m build
    path: .

variables:
  root_path:
    description: root_path for the target
    default: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files
  git_sha:
    description: git_sha
    default: d50bbb89c1a26e7d7f1b76bf73d5e1ff2e78859d
  schedule_pause_status:
    description: schedule pause status
    default: "UNPAUSED"

resources:
  jobs:
    hotel-cancels:
      name: hotel-cancels-dev-pipeline
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "Europe/Amsterdam"
        pause_status: ${var.schedule_pause_status}
      tags:
        project_name: "hotel-cancels-project"
      job_clusters:
        - job_cluster_key: "hotel-cancels-cluster"
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            data_security_mode: "SINGLE_USER"
            node_type_id: "r3.xlarge"
            driver_node_type_id: "r3.xlarge"
            autoscale:
              min_workers: 1
              max_workers: 1

      tasks:
        - task_key: "preprocess"
          # job_cluster_key: "hotel-cancels-cluster"
          existing_cluster_id: ${bundle.cluster_id}
          spark_python_task:
            python_file: "pipeline/preprocess.py"
            parameters:
              - "--root_path"
              - ${var.root_path}
          libraries:
           - whl: ./dist/*.whl
        - task_key: if_refreshed
          condition_task:
            op: "EQUAL_TO"
            left: "{{tasks.preprocess.values.refreshed}}"
            right: "1"
          depends_on:
            - task_key: "preprocess"
        - task_key: "train_model"
          depends_on:
            - task_key: "if_refreshed"
              outcome: "true"
          # job_cluster_key: "hotel-cancels-cluster"
          existing_cluster_id: ${bundle.cluster_id}
          spark_python_task:
            python_file: "pipeline/train_model.py"
            parameters:
              - "--root_path"
              - ${var.root_path}
              - "--git_sha"
              - ${var.git_sha}
              - "--job_run_id"
              - "{{job.id}}"
          libraries:
            - whl: ./dist/*.whl
        - task_key: "evaluate_model"
          depends_on:
            - task_key: "train_model"
          # job_cluster_key: "hotel-cancels-cluster"
          existing_cluster_id: ${bundle.cluster_id}
          spark_python_task:
            python_file: "pipeline/evaluate_model.py"
            parameters:
              - "--root_path"
              - ${var.root_path}
              - "--new_model_uri"
              - "{{tasks.train_model.values.new_model_uri}}"
              - "--job_run_id"
              - "{{job.id}}"
              - "--git_sha"
              - ${var.git_sha}
          libraries:
            - whl: ./dist/*.whl
        - task_key: "serve"
          depends_on:
            - task_key: "evaluate_model"
          # job_cluster_key: "hotel-cancels-cluster"
          existing_cluster_id: ${bundle.cluster_id}
          spark_python_task:
            python_file: "pipeline/serve.py"
            parameters:
              - "--root_path"
              - ${var.root_path}
              - "--model_update"
              - "{{tasks.evaluate_model.values.model_update}}"
              - "--new_model_version"
              - "{{tasks.evaluate_model.values.new_model_version}}"
          libraries:
            - whl: ./dist/*.whl

sync:
  include:
  - ./dist/*.whl

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-643c4c2b-d6c9.cloud.databricks.com
      profile: DEFAULT

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-643c4c2b-d6c9.cloud.databricks.com
